name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: videira
          POSTGRES_PASSWORD: videira
          POSTGRES_DB: videira
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U videira -d videira"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://videira:videira@127.0.0.1:5433/videira
      DIRECT_URL: postgresql://videira:videira@127.0.0.1:5433/videira

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Block destructive Prisma migrations
        run: npm run check:migrations

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
